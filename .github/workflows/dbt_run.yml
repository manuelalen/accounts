name: dbt Run Pipeline
on:
  workflow_dispatch:
  repository_dispatch:
    types: [storage_file_uploaded]

jobs:
  dbt_run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          pip install dbt-postgres requests psycopg2-binary

      - name: Ingest CSV files from Storage
        id: ingest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          DBT_DB_PASSWORD: ${{ secrets.DBT_DB_PASSWORD }}
        run: python scripts/ingest_from_storage.py

      - name: Run dbt
        env:
          DBT_DB_PASSWORD: ${{ secrets.DBT_DB_PASSWORD }}
        run: |
          TARGET_DATE=$(date +'%Y-%m-%d')
          dbt run --project-dir dbt --profiles-dir dbt --select stg_movimientos \
                  --vars "{'target_date': '$TARGET_DATE'}"

      - name: Verify row count
        env:
          DBT_DB_PASSWORD: ${{ secrets.DBT_DB_PASSWORD }}
        run: |
          PGPASSWORD=$DBT_DB_PASSWORD psql -h aws-1-eu-central-2.pooler.supabase.com \
            -p 6543 -U postgres.fzdpeakdudjfyvgrhrqq -d postgres \
            -c "SELECT COUNT(*) AS total_rows FROM bronze.stg_movimientos"
