jobs:
  run_pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dbt
        run: |
          pip install dbt-postgres
          
      - name: Setup Date
        id: date
        run: |
          TARGET_DATE=${{ github.event.inputs.manual_date }}
          TARGET_DATE=${TARGET_DATE:-$(date +'%Y-%m-%d')}
          echo "target_date=$TARGET_DATE" >> $GITHUB_OUTPUT
          
      - name: dbt Run
        env:
          DBT_ENV_SECRET_PASSWORD: ${{ secrets.DBT_DB_PASSWORD }}
        run: |
          dbt run --project-dir dbt --profiles-dir dbt --select stg_movimientos \
                  --vars "{'target_date': '${{ steps.date.outputs.target_date }}'}"