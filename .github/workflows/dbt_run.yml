name: dbt Run Pipeline
on:
  workflow_dispatch:
  repository_dispatch:
    types: [new_file_uploaded]

jobs:
  dbt_run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dbt
        run: pip install dbt-postgres

      - name: Run dbt
        env:
          # Debe coincidir con la variable en tu profiles.yml
          DBT_DB_PASSWORD: ${{ secrets.DBT_DB_PASSWORD }}
        run: |
          TARGET_DATE=$(date +'%Y-%m-%d')
          dbt run --project-dir dbt --profiles-dir dbt --select stg_movimientos \
                  --vars "{'target_date': '$TARGET_DATE'}"