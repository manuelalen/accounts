name: dbt Run 
on:
  workflow_dispatch:
    inputs:
      manual_date:
        description: 'Fecha manual (YYYY-MM-DD)'
        required: false

jobs:
  dbt_run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Date
        id: date
        run: |
          TARGET_DATE=${{ github.event.inputs.manual_date }}
          TARGET_DATE=${TARGET_DATE:-$(date +'%Y-%m-%d')}
          echo "target_date=$TARGET_DATE" >> $GITHUB_OUTPUT
          
      - name: dbt Run
        env:
          DBT_ENV_SECRET_PASSWORD: ${{ secrets.DBT_DB_PASSWORD }}
        run: |
          dbt run --select stg_movimientos \
                  --vars "{'target_date': '${{ steps.date.outputs.target_date }}'}"