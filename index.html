<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingesta de Datos - Data Lake</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; max-width: 500px; margin: 60px auto; padding: 20px; background-color: #f8fafc; }
        .box { border: 1px solid #e2e8f0; padding: 35px; border-radius: 12px; background: white; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        h2 { margin-top: 0; color: #0f172a; }
        input[type="file"] { display: block; width: 100%; margin: 20px 0; padding: 14px; border: 2px dashed #cbd5e1; border-radius: 8px; box-sizing: border-box; cursor: pointer; }
        button { display: block; width: 100%; padding: 12px; background: #3ecf8e; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
        #status { font-weight: 500; margin-top: 24px; padding: 12px; border-radius: 6px; display: none; white-space: pre-wrap; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="box">
    <h2>Subir CSV al Data Lake</h2>
    <input type="file" id="csvFile" accept=".csv">
    <button onclick="uploadToStorage()">Subir Archivo</button>
    <div id="status"></div>
</div>

<script>
    const SUPABASE_URL = "__SUPABASE_URL_PLACEHOLDER__";
    const SUPABASE_ANON_KEY = "__SUPABASE_ANON_KEY_PLACEHOLDER__";
    
    // CORRECCIÓN: Le llamamos supabaseClient para que no rompa la librería nativa
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function showStatus(text, isError = false) {
        const statusDiv = document.getElementById('status');
        statusDiv.style.display = 'block';
        statusDiv.style.backgroundColor = isError ? '#fef2f2' : '#f0fdf4';
        statusDiv.style.color = isError ? '#991b1b' : '#166534';
        statusDiv.style.border = `1px solid ${isError ? '#fca5a5' : '#bbf7d0'}`;
        statusDiv.innerText = text;
    }

    async function uploadToStorage() {
        const fileInput = document.getElementById('csvFile');
        
        if (!fileInput.files.length) {
            showStatus("⚠️ Por favor, selecciona un archivo CSV primero.", true);
            return;
        }

        const file = fileInput.files[0];
        showStatus("⏳ Subiendo archivo al Data Lake...");

        const ahora = new Date();
        const yyyy = ahora.getFullYear();
        const mm = String(ahora.getMonth() + 1).padStart(2, '0');
        const dd = String(ahora.getDate()).padStart(2, '0');
        const folderPath = `${yyyy}/${mm}/${dd}/${file.name}`;

        try {
            // Usamos la variable corregida aquí
            const { data, error } = await supabaseClient.storage
                .from('raw-data-lake')
                .upload(folderPath, file, {
                    cacheControl: '3600',
                    upsert: true
                });

            if (error) {
                showStatus(`❌ Error de Supabase:\n${error.message}`, true);
            } else {
                showStatus(`⏳ Insertando datos en bronze...`, false);
                fileInput.value = "";

                // Llamar a la Edge Function para procesar el CSV
                try {
                    const edgeRes = await fetch(`${SUPABASE_URL}/functions/v1/trigger-dbt-pipeline`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                        },
                        body: JSON.stringify({
                            type: 'INSERT',
                            record: {
                                bucket_id: 'raw-data-lake',
                                name: data.path
                            }
                        })
                    });

                    if (!edgeRes.ok) {
                        const errText = await edgeRes.text();
                        showStatus(`⚠️ Archivo subido, pero error al procesar:\n${errText}`, true);
                    } else {
                        showStatus(`✅ CSV ingestado en bronze.stg_movimientos`, false);
                    }
                } catch (fnErr: any) {
                    showStatus(`⚠️ Archivo subido, pero falló la función:\n${fnErr.message}`, true);
                }
            }
        } catch (err) {
            showStatus(`❌ Fallo en la operación:\n${err.message}`, true);
        }
    }
</script>
</body>
</html>
